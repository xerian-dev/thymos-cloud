<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThymosTicket — Download</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0a;
            color: #e5e5e5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 400px;
            width: 100%;
            padding: 2rem;
        }
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #fff;
        }
        .logo p {
            color: #737373;
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }
        .card {
            background: #171717;
            border: 1px solid #262626;
            border-radius: 12px;
            padding: 2rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            font-size: 0.875rem;
            color: #a3a3a3;
            margin-bottom: 0.375rem;
        }
        input {
            width: 100%;
            padding: 0.625rem 0.75rem;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-size: 0.875rem;
            outline: none;
            transition: border-color 0.15s;
        }
        input:focus {
            border-color: #4f8f4f;
        }
        button {
            width: 100%;
            padding: 0.625rem;
            background: #166534;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: background 0.15s;
        }
        button:hover { background: #15803d; }
        button:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }
        .error {
            color: #ef4444;
            font-size: 0.8rem;
            margin-top: 0.5rem;
            display: none;
        }
        .error.visible { display: block; }
        .download-section {
            text-align: center;
            display: none;
        }
        .download-section.visible { display: block; }
        .download-section h2 {
            font-size: 1.125rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }
        .download-section p {
            color: #737373;
            font-size: 0.8rem;
            margin-bottom: 1.5rem;
        }
        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: #166534;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.15s;
        }
        .download-btn:hover { background: #15803d; }
        .download-btn svg { width: 20px; height: 20px; }
        .version {
            color: #525252;
            font-size: 0.75rem;
            margin-top: 1rem;
        }
        .logout {
            color: #737373;
            font-size: 0.8rem;
            text-decoration: underline;
            cursor: pointer;
            margin-top: 1.5rem;
            display: inline-block;
        }
        .logout:hover { color: #a3a3a3; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>ThymosTicket</h1>
            <p>Item Capture for macOS</p>
        </div>

        <!-- Login Form -->
        <div class="card" id="login-card">
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" autocomplete="current-password" required>
                </div>
                <div class="error" id="error-msg"></div>
                <button type="submit" id="login-btn">Sign In</button>
            </form>
        </div>

        <!-- Download Section -->
        <div class="card download-section" id="download-card">
            <h2>Download ThymosTicket</h2>
            <p>macOS 14 (Sonoma) or later required</p>
            <div style="background:#1c1917;border:1px solid #362e2a;border-radius:8px;padding:0.75rem 1rem;margin-bottom:1rem;text-align:left">
                <p style="color:#a3a3a3;font-size:0.75rem;margin-bottom:0.375rem">After installing, run in Terminal:</p>
                <code style="color:#d6d3d1;font-size:0.75rem;font-family:monospace">xattr -cr /Applications/ThymosTicket.app</code>
            </div>
            <a class="download-btn" id="download-link" href="#">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                </svg>
                Download .dmg
            </a>
            <div class="version" id="version-info"></div>
            <span class="logout" id="logout-btn">Sign out</span>
        </div>
    </div>

    <script type="module">
        // Config
        const COGNITO_REGION = 'eu-central-1';
        const USER_POOL_ID = 'eu-central-1_GjRTDO3K2';
        const CLIENT_ID = 'n4eb0ed0m1p2fkp814l3mes12';
        const DMG_URL = '/downloads/ThymosTicket-latest.dmg';
        const VERSION = '1.0.0';

        // Cognito SRP-less auth (USER_PASSWORD_AUTH)
        async function signIn(email, password) {
            const response = await fetch(`https://cognito-idp.${COGNITO_REGION}.amazonaws.com/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-amz-json-1.1',
                    'X-Amz-Target': 'AWSCognitoIdentityProviderService.InitiateAuth',
                },
                body: JSON.stringify({
                    AuthFlow: 'USER_PASSWORD_AUTH',
                    ClientId: CLIENT_ID,
                    AuthParameters: {
                        USERNAME: email,
                        PASSWORD: password,
                    },
                }),
            });

            const data = await response.json();
            if (data.__type) {
                const msg = data.message || 'Authentication failed';
                throw new Error(msg);
            }
            return data.AuthenticationResult;
        }

        // DOM
        const loginCard = document.getElementById('login-card');
        const downloadCard = document.getElementById('download-card');
        const loginForm = document.getElementById('login-form');
        const loginBtn = document.getElementById('login-btn');
        const errorMsg = document.getElementById('error-msg');
        const downloadLink = document.getElementById('download-link');
        const versionInfo = document.getElementById('version-info');
        const logoutBtn = document.getElementById('logout-btn');

        function showDownload() {
            loginCard.style.display = 'none';
            downloadCard.classList.add('visible');
            downloadLink.href = DMG_URL;
            versionInfo.textContent = `Version ${VERSION}`;
        }

        function showLogin() {
            loginCard.style.display = 'block';
            downloadCard.classList.remove('visible');
            sessionStorage.removeItem('thymos_auth');
        }

        // Check session
        if (sessionStorage.getItem('thymos_auth')) {
            showDownload();
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.remove('visible');
            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';

            try {
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                await signIn(email, password);
                sessionStorage.setItem('thymos_auth', '1');
                showDownload();
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.classList.add('visible');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        });

        logoutBtn.addEventListener('click', showLogin);
    </script>
</body>
</html>
